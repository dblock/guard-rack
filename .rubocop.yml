plugins:
- rubocop-md
- rubocop-prose
- rubocop-rake
- rubocop-spellcheck
- rubocop-yaml

inherit_from: ".rubocop_todo.yml"

AllCops:
  NewCops: enable
  TargetRubyVersion: 2.7
  SuggestExtensions: false
  inherit_mode:
    merge:
    - Include
  Include:
  - ".github/**/*.yml"
  - ".rubocop.yml"
  Exclude:
  - bin/**/*
  - pkg/**/*
  - vendor/**/*

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

YAML/Lint/InvalidSyntax:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

YAML/Lint/DuplicateKey:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

Naming/FileName:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"
  - ".github/workflows/*.yml"

Layout/LineLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - ".github/workflows/*.yml"

Markdown/HeadingCapitalization:
  inherit_mode:
    merge:
    - Exclude
  Enabled: true
  Style: title_case
  Exclude:
  - CHANGELOG.md

Prose/MaxLength:
  inherit_mode:
    merge:
    - Exclude
  Max: false
  Exclude:
  - CHANGELOG.md
  # The license text is kept verbatim.
  - LICENSE.md

Spellcheck:
  DictionaryFiles:
    en:
    - gem:rubocop-spellcheck/data/en/en.dic
    - ".spellcheck.txt"
Spellcheck/Spelling:
  Exclude: []

Markdown/CompactLists:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - CHANGELOG.md

Markdown/FenceLanguage:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - CHANGELOG.md
